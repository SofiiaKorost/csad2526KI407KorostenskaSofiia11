name: CI Workflow

on:
  push:
    branches:
      - '*develop*'
      - '*master*'
  pull_request:
    branches:
      - '*develop*'
      - '*master*'

jobs:
  cross_build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install cmake -y
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install cmake
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install cmake
          fi

      - name: Build project
        run: |
          chmod +x ./ci.sh
          ./ci.sh

      - name: Deploy
        run: echo "Deploy step here"

